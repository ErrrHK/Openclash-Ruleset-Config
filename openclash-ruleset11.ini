[custom]

; ==========================================================
; 大陸白名單模式
; 白名單終極優化版 V2
;
; 核心邏輯：
; ① 私有網路 / LAN
; ② 香港電視等指定服務
; ③ 海外特殊服務
; ④ 中國大陸白名單
; ⑤ GEOIP,CN
; ⑥ 未命中規則 → 代理
;
; 原則：
; - 特殊服務優先
; - 中國大陸服務直連
; - 未知海外流量最後代理
; - 避免大量重複第三方規則
; ==========================================================


; ==========================================================
; ① 私有網路 / LAN
; ==========================================================

ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve
ruleset=DIRECT,[]GEOIP,LAN,no-resolve


; ==========================================================
; ② 香港電視 / 港澳服務
; 必須放在中國規則之前
; ==========================================================

ruleset=🇭🇰 mytvsuperAD,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/mytvsuperAD.list

ruleset=🇭🇰 myTVSUPER,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/myTVSUPER.list

ruleset=🇭🇰 ViuTV,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/ViuTV.list

ruleset=🇭🇰 NowTV,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/NowTV.list

ruleset=🇭🇰 RTHK,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/RTHK.list

ruleset=🇭🇰 HOY,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/HOY.list


; ==========================================================
; ③ Google / YouTube
;
; YouTube 必須與 Google Services 分開
; 防止 Google 規則提前搶走 YouTube
; ==========================================================

ruleset=📺 YouTube,[]GEOSITE,youtube

ruleset=📢 Google Services,[]GEOSITE,google

ruleset=📢 Google Services,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/TimeAndroid.list

ruleset=📢 Google Services,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com

ruleset=📢 Google Services,[]DOMAIN-SUFFIX,services.googleapis.cn

ruleset=📢 Google Services,https://whatshub.top/rule/Google.list

ruleset=📢 Google Services,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list

ruleset=📢 Google Services,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list

ruleset=📢 Google Services,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list


; ==========================================================
; ④ OpenAI / ChatGPT
; ==========================================================

ruleset=🇺🇲 OpenAI,[]GEOSITE,openai

ruleset=🇺🇲 OpenAI,https://whatshub.top/rule/OpenAI.list

ruleset=🇺🇲 ChatGPT,https://whatshub.top/rule/ChatGPT.list


; ==========================================================
; ⑤ TikTok
;
; 原來 7 個重複規則縮減
; GEOSITE,tiktok 作為主規則
; BlackMatrix 作為補充
; ==========================================================

ruleset=🎵 TikTok,[]GEOSITE,tiktok

ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list


; ==========================================================
; ⑥ Microsoft
;
; 原來 4 個高度重複來源縮減
; ==========================================================

ruleset=🍃 Microsoft Services,[]GEOSITE,microsoft

ruleset=🍃 Microsoft Services,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list


; ==========================================================
; ⑦ Bing
; ==========================================================

ruleset=Ⓜ️ Bing,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/Bing.list


; ==========================================================
; ⑧ 指定區域服務
; ==========================================================

ruleset=🇨🇳 TaiWan,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/TaiWan.list

ruleset=🇺🇲 USA,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/USA.list

ruleset=🇸🇬 Singapore,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/Singapore.list


; ==========================================================
; ⑨ Windows 必要服務
; ==========================================================

ruleset=DIRECT,[]DOMAIN-SUFFIX,time.windows.com

ruleset=DIRECT,[]DOMAIN-SUFFIX,client.wns.windows.com


; ==========================================================
; ⑩ 中國大陸白名單
;
; 這部分是本方案核心
; ==========================================================

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list


; ==========================================================
; ⑪ Meta CN 網域分類
;
; 放在特殊海外服務之後
; 避免 OpenAI / Google / TikTok / YouTube 等被 CN 規則提前截走
; ==========================================================

ruleset=DIRECT,[]GEOSITE,cn


; ==========================================================
; ⑫ 最後中國 IP 兜底
; ==========================================================

ruleset=DIRECT,[]GEOIP,CN,no-resolve


; ==========================================================
; ⑬ 最終規則
;
; 未命中：
; → 🚀 Proxies
; ==========================================================

ruleset=🚀 Proxies,[]FINAL


; ==========================================================
; ==========================================================
; 策略組
; ==========================================================
; ==========================================================


; ==========================================================
; 主代理策略
; ==========================================================

custom_proxy_group=🚀 Proxies`select`[]♻️ Auto - UrlTest`[]🇭🇰 myTVSUPER`[]🇭🇰 mytvsuperAD`[]🇭🇰 ViuTV`[]🇭🇰 NowTV`[]🇭🇰 RTHK`[]🇭🇰 HOY`[]🇨🇳 TaiWan`[]🇺🇲 USA`[]🇸🇬 Singapore`[]DIRECT`.*


; ==========================================================
; 自動選擇
; ==========================================================

custom_proxy_group=♻️ Auto - UrlTest`url-test`.*`http://www.gstatic.com/generate_204`300,,50


; ==========================================================
; 香港 TV
; ==========================================================

custom_proxy_group=🇭🇰 myTVSUPER`select`(?i)(🇭🇰|香港|HK|Hong Kong|HongKong)

custom_proxy_group=🇭🇰 mytvsuperAD`select`(?i)(🇭🇰|香港|HK|Hong Kong|HongKong)`[]DIRECT`[]REJECT

custom_proxy_group=🇭🇰 ViuTV`select`(?i)(🇭🇰|香港|HK|Hong Kong|HongKong)

custom_proxy_group=🇭🇰 NowTV`select`(?i)(🇭🇰|香港|HK|Hong Kong|HongKong)

custom_proxy_group=🇭🇰 RTHK`select`(?i)(🇭🇰|香港|HK|Hong Kong|HongKong)

custom_proxy_group=🇭🇰 HOY`select`(?i)(🇭🇰|香港|HK|Hong Kong|HongKong)


; ==========================================================
; 台灣
; ==========================================================

custom_proxy_group=🇨🇳 TaiWan`select`(?i)(🇹🇼|台湾|台灣|TW|Taiwan|Taipei)


; ==========================================================
; 美國
; ==========================================================

custom_proxy_group=🇺🇲 USA`select`(?i)(🇺🇸|美国|美國|US|United States|Los Angeles|San Jose|Seattle|New York|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Santa Clara|Chicago)


; ==========================================================
; 新加坡
; ==========================================================

custom_proxy_group=🇸🇬 Singapore`select`(?i)(🇸🇬|新加坡|SG|Singapore|狮城|獅城)


; ==========================================================
; Google
; ==========================================================

custom_proxy_group=📢 Google Services`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]🇭🇰 myTVSUPER`[]🇨🇳 TaiWan`[]🇸🇬 Singapore`[]🇺🇲 USA`[]DIRECT`.*


; ==========================================================
; YouTube
; ==========================================================

custom_proxy_group=📺 YouTube`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]🇭🇰 myTVSUPER`[]🇨🇳 TaiWan`[]🇸🇬 Singapore`[]🇺🇲 USA`[]DIRECT`.*


; ==========================================================
; Microsoft
; ==========================================================

custom_proxy_group=🍃 Microsoft Services`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]🇸🇬 Singapore`[]🇭🇰 myTVSUPER`[]🇨🇳 TaiWan`[]🇺🇲 USA`[]DIRECT`.*


; ==========================================================
; OpenAI
; ==========================================================

custom_proxy_group=🇺🇲 OpenAI`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]🇺🇲 USA`[]🇸🇬 Singapore`[]🇯🇵 日本`[]🇭🇰 myTVSUPER`[]DIRECT`.*


; ==========================================================
; ChatGPT
; ==========================================================

custom_proxy_group=🇺🇲 ChatGPT`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]🇺🇲 USA`[]🇸🇬 Singapore`[]🇯🇵 日本`[]🇭🇰 myTVSUPER`[]DIRECT`.*


; ==========================================================
; TikTok
; ==========================================================

custom_proxy_group=🎵 TikTok`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]🇺🇲 USA`[]🇸🇬 Singapore`[]🇯🇵 日本`[]🇭🇰 myTVSUPER`[]DIRECT`.*


; ==========================================================
; Bing
; ==========================================================

custom_proxy_group=Ⓜ️ Bing`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]🇺🇲 USA`[]🇸🇬 Singapore`[]🇭🇰 myTVSUPER`[]DIRECT`.*


; ==========================================================
; 啟用自訂規則
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

custom_proxy_group=🇨🇳 TaiWan`select`(?i)(🇹🇼|台湾|台灣|TW|Taiwan|Taipei)
custom_proxy_group=🇺🇲 USA`select`(?i)(🇺🇸|美国|美國|US|United States|Los Angeles|San Jose|Seattle|New York|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Santa Clara|Chicago)
custom_proxy_group=🇸🇬 Singapore`select`(?i)(🇸🇬|新加坡|SG|Singapore|狮城|獅城)
custom_proxy_group=📢 Google Services`select`[]🚀 Proxies`select`[]♻️ Auto - UrlTest`[]DIRECT`.*
custom_proxy_group=📺 YouTube`select`[]🚀 Proxies`[]♻️ Auto - UrlTest`[]DIRECT`.*
